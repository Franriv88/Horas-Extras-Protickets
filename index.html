<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/icon/color1.png">
    <link rel="stylesheet" href="styles.css">
    <title>Horas Extras</title>
</head>
<body>
    <div class="container">
        <fieldset>
        <legend>Horas Extras</legend>
        <div class="resumen">
            <div class="mes">
            <input type="month" class="inputPpales" name="" id="">
        </div>
        <div class="totales">
            <p><span id="totalHoras">---</span></p>
            <input type="number" class="inputPpales">
            <input type="number" class="inputPpales">
        </div>
        </div>
        <button class="addButton" type="button" onclick="agregarFila()">Agregar fila</button>
        <div class="datos">
            <table id="miTabla" class="talbe-wrapper">
            <thead>
                <tr>
                    <th>Fecha</th>
                    <th>Hora inicio</th>
                    <th>Hora fin</th>
                    <th id="sum">&#8721</th> <!-- para que aparezca el símbolo de sumatoria es co nese código -->
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td><input type="date" name="fecha[]" onchange="calcularHoras(this)"></td>
                    <td><input type="time" name="horaInicio[]" onchange="calcularHoras(this)"></td>
                    <td><input type="time" name="horaFin[]" onchange="calcularHoras(this)"></td>
                    <td><p><span class="sumaParcial" name="cantHoras[]" onchange="">0</span></p></td>
                    <td><button class="delete-btn" onclick="eliminarFila(this)">X</button></td>
                </tr>
            </tbody>
            </table>
        </div>
        </fieldset>
    </div>
    <script src="script.js"></script>
</body>
</html>

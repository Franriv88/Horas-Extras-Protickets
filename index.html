<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1bb566">
    <link rel="icon" href="/icon/color1.png">
    <link rel="stylesheet" href="styles.css">
    <title>Horas Extras</title>
</head>
<body>
    <div class="container">
        <fieldset>
        <legend>Horas Extras</legend>
        <div class="resumen">
            <div class="mes">
                <input type="month" class="inputPpales" name="" id="mesSeleccionado" onchange="guardarDatos()">
            </div>
            <div class="totales">
                <p><span id="totalHoras">---</span></p>
            <div class="galeno_viaticos">
                <div class="input-con-simbolo">
                    <p class="layers">Galeno</p>
                    <input type="number" class="inputPpales" id="galeno" placeholder="Galeno " onchange="guardarDatos()">
                </div>
                <div class="input-con-simbolo">
                    <p class="layers">Viáticos</p>
                    <input type="number" class="inputPpales" id="viaticos" placeholder="Viáticos" onchange="guardarDatos()">
                </div>
            </div>
        </div>
        </div>
        <button class="addButton" type="button" onclick="agregarFila()">Agregar fila</button>
        <div class="datos">
            <table id="miTabla" class="talbe-wrapper">
    <thead>
        <tr>
            <th id="feriado">¿Feriado?</th> 
            <th>Día</th>
            <th>Fecha</th>
            <th>Hora inicio</th>
            <th>Hora fin</th>
            <th id="sum">&#8721;</th>
        </tr>
    </thead>
    <tbody>
        <tr>
            <td>
                <button class="btn-activar" onclick="toggleActivarFila(this)">Feriado</button>
            </td>
            <td><span class="dia-semana">---</span></td>
            <td><input type="date" name="fecha[]" onchange="calcularHorasYDia(this)"></td>
            <td><input type="time" name="horaInicio[]" onchange="calcularHorasYDia(this)"></td>
            <td><input type="time" name="horaFin[]" onchange="calcularHorasYDia(this)"></td>
            <td><p><span class="sumaParcial" name="cantHoras[]">0</span></p></td>
            <td><button class="delete-btn" onclick="eliminarFila(this)">X</button></td>
        </tr>
    </tbody>
</table>
        </div>
        </fieldset>
    </div>
    <script src="script.js"></script>
</body>
</html>
